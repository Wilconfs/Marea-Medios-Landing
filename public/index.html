<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Marea Medios | Agencia de Contenido Digital</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-9th1Ka8c.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BNV1RvH8.css">
    
    <style>
      #contacto, 
      form:not(#marea-modal-form):not(#marea-chat-floating-form) {
        display: none !important;
      }

      /* --- ESTILOS DE LA MODAL PRINCIPAL (AGENDA) --- */
      .marea-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 9999999 !important;
        display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease;
      }
      .marea-modal-overlay.marea-active { opacity: 1; }
      .marea-modal-content {
        background: #121212; border: 1px solid #222; border-top: 4px solid #ffde59; width: 100%; max-width: 500px; padding: 32px; position: relative; transform: translateY(-20px); transition: transform 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .marea-modal-overlay.marea-active .marea-modal-content { transform: translateY(0); }
      .marea-modal-close { position: absolute; top: 12px; right: 16px; background: transparent; border: none; color: #666; font-size: 28px; cursor: pointer; }
      .marea-modal-close:hover { color: #ffde59; }
      .marea-modal-header h2 { font-family: 'Anton', sans-serif; color: #fff; font-size: 22px; margin: 0 0 6px 0; text-transform: uppercase; }
      .marea-modal-header p { color: #888; font-size: 13px; margin: 0 0 24px 0; }
      .marea-form-group { margin-bottom: 16px; text-align: left; }
      .marea-form-group label { display: block; color: #aaa; font-size: 11px; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
      .marea-form-group input, .marea-form-group textarea { width: 100%; background: #1a1a1a; border: 1px solid #2d2d2d; padding: 12px; color: #fff; font-size: 14px; box-sizing: border-box; }
      .marea-form-group input:focus, .marea-form-group textarea:focus { outline: none; border-color: #ffde59; }
      .marea-form-submit { width: 100%; background: #ffde59; color: #000; border: none; padding: 14px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
      .marea-form-submit:hover { background: #fff; }

      /* --- ESTILOS DEL WIDGET DE CHAT VERDE WHATSAPP --- */
      .marea-floating-widget {
        position: fixed; bottom: 30px; right: 30px; z-index: 9999999 !important;
        display: flex; flex-direction: column; align-items: flex-end; font-family: 'Open Sans', sans-serif;
      }

      /* Ventana de Chat */
      .marea-chat-card {
        width: 330px; background: #161616; border: 1px solid #262626; border-radius: 12px;
        box-shadow: 0 12px 36px rgba(0,0,0,0.6); margin-bottom: 14px;
        display: none; flex-direction: column; overflow: hidden;
        transform: translateY(15px); opacity: 0; transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .marea-floating-widget.chat-visible .marea-chat-card {
        display: flex; transform: translateY(0); opacity: 1;
      }

      /* Encabezado */
      .marea-chat-card-header {
        background: #1e1e1e; padding: 16px; border-bottom: 1px solid #262626;
        display: flex; justify-content: space-between; align-items: center;
      }
      .marea-chat-card-title h4 { color: #ffffff; margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
      .marea-chat-status { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
      .marea-status-dot { width: 7px; height: 7px; background-color: #2ec4b6; border-radius: 50%; display: inline-block; }
      .marea-chat-status span { color: #888888; font-size: 11px; }
      .marea-chat-card-close { background: transparent; border: none; color: #666; font-size: 22px; cursor: pointer; line-height: 1; }
      .marea-chat-card-close:hover { color: #ffde59; }

      /* Cuerpo y Form */
      .marea-chat-card-body { padding: 16px; background: #161616; display: flex; flex-direction: column; gap: 12px; }
      .marea-chat-card-textarea {
        width: 100%; height: 100px; background: #1c1c1c; border: 1px solid #2d2d2d; border-radius: 8px;
        padding: 12px; color: #ffffff; font-size: 13px; resize: none; box-sizing: border-box;
        font-family: inherit; line-height: 1.4; outline: none; transition: border-color 0.2s;
      }
      .marea-chat-card-textarea:focus { border-color: #25D366; } /* Foco cambia al verde WhatsApp */

      /* Footer del Chat con botón de envío verde */
      .marea-chat-card-footer { display: flex; justify-content: flex-end; align-items: center; }
      .marea-chat-card-send {
        background: #25D366; color: #ffffff; border: none; width: 40px; height: 40px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); transition: transform 0.2s, background-color 0.2s;
      }
      .marea-chat-card-send:hover { transform: scale(1.05); background: #20ba5a; }
      .marea-chat-card-send svg { margin-left: 2px; }

      /* Botón Flotante Redondo Verde WhatsApp Oficial */
      .marea-circle-trigger {
        background: #25D366; color: #ffffff; border: none; width: 56px; height: 56px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35); cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
      }
      .marea-circle-trigger:hover { transform: scale(1.05); background: #20ba5a; }
      .marea-circle-trigger.active-state { background: #1e1e1e; color: #25D366; border: 1px solid #262626; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

      @media (max-width: 480px) {
        .marea-floating-widget { bottom: 20px; right: 20px; }
        .marea-chat-card { width: 290px; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <div id="marea-modal" class="marea-modal-overlay" style="display: none;">
      <div class="marea-modal-content">
        <button class="marea-modal-close" id="close-marea-modal">&times;</button>
        
        <div class="marea-modal-header">
          <h2>AGENDA TU <span style="color: #ffde59;">REUNIÓN ESTRATÉGICA</span></h2>
          <p>Déjanos tus datos y la marea se encargará de mover tu marca.</p>
        </div>

        <form id="marea-modal-form" onsubmit="return false;">
          <div id="marea-error-msg" style="color: #ff4a4a; font-size: 13px; margin-bottom: 15px; display: none; font-weight: bold; background: rgba(255,74,74,0.1); padding: 10px; border-left: 4px solid #ff4a4a; text-align: left;"></div>

          <div class="marea-form-group">
            <label>Nombre Completo *</label>
            <input type="text" id="marea-name" placeholder="Ej: Juan Pérez" autocomplete="off" />
          </div>

          <div class="marea-form-group">
            <label>Correo Electrónico *</label>
            <input type="email" id="marea-email" placeholder="ejemplo@correo.com" autocomplete="off" />
          </div>

          <div class="marea-form-group">
            <label>Teléfono / WhatsApp *</label>
            <input type="tel" id="marea-phone" placeholder="Ej: 312 345 6789" autocomplete="off" />
          </div>

          <div class="marea-form-group">
            <label>Nombre de tu Negocio *</label>
            <input type="text" id="marea-business" placeholder="Ej: Marca o Empresa" autocomplete="off" />
          </div>

          <div class="marea-form-group">
            <label>Cuéntanos sobre tu negocio</label>
            <textarea id="marea-msg" rows="3" placeholder="¿Qué objetivos buscas alcanzar?"></textarea>
          </div>

          <button type="button" id="marea-submit-btn" class="marea-form-submit">
            ENVIAR A WHATSAPP Y AGENDAR →
          </button>
        </form>
      </div>
    </div>


    <div class="marea-floating-widget" id="marea-support-widget">
      
      <div class="marea-chat-card" id="marea-chat-card">
        <div class="marea-chat-card-header">
          <div class="marea-chat-card-title">
            <h4>Soporte Marea Medios</h4>
            <div class="marea-chat-status">
              <span class="marea-status-dot"></span>
              <span>En línea</span>
            </div>
          </div>
          <button type="button" class="marea-chat-card-close" id="close-chat-card-btn">&times;</button>
        </div>
        
        <div class="marea-chat-card-body">
          <form id="marea-chat-floating-form" onsubmit="return false;">
            <textarea class="marea-chat-card-textarea" id="marea-widget-text" placeholder="Escribe tu mensaje..."></textarea>
            <div class="marea-chat-card-footer">
              <button type="button" class="marea-chat-card-send" id="marea-widget-send-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>

      <button class="marea-circle-trigger" id="marea-widget-toggle-btn">
        <svg id="marea-widget-chat-icon" xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 16 16">
          <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.69-4.29c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
        </svg>
        <span id="marea-widget-close-icon" style="display: none; font-size: 24px; line-height: 1; font-weight: 300;">&times;</span>
      </button>

    </div>


    <script>
      (() => {
        // Número de soporte de la agencia con prefijo de Colombia (57)
        const numeroAgenciaWhatsApp = "573000000000"; // 👈 REEMPLAZA CON TU NÚMERO REAL

        // 1. BYPASS INTERCEPTOR GLOBAL (Para los botones de Agendamiento del sitio de React)
        document.addEventListener("click", (event) => {
          const target = event.target.closest("button, a");
          if (target && (target.textContent.toUpperCase().includes("AGENDA") || target.textContent.toUpperCase().includes("MENSAJE"))) {
            if (target.id === "marea-submit-btn" || target.id === "marea-widget-toggle-btn" || target.id === "marea-widget-send-arrow" || target.id === "close-chat-card-btn") return;
            
            event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation();
            openMareaModal();
          }
        }, true);

        const modal = document.getElementById("marea-modal");
        const closeBtn = document.getElementById("close-marea-modal");
        const submitBtn = document.getElementById("marea-submit-btn");
        const errorDiv = document.getElementById("marea-error-msg");

        function openMareaModal() {
          if (modal) { modal.style.display = "flex"; if(errorDiv) errorDiv.style.display="none"; setTimeout(() => modal.classList.add("marea-active"), 10); }
        }
        function closeModal() { if (modal) { modal.classList.remove("marea-active"); setTimeout(() => modal.style.display = "none", 300); } }
        if (closeBtn) closeBtn.addEventListener("click", closeModal);

        if (submitBtn) {
          submitBtn.addEventListener("click", () => {
            const name = document.getElementById("marea-name").value.trim();
            const email = document.getElementById("marea-email").value.trim();
            const phone = document.getElementById("marea-phone").value.trim();
            const business = document.getElementById("marea-business").value.trim();
            const msg = document.getElementById("marea-msg").value.trim();

            if (!name || !email || !phone || !business) { errorDiv.textContent = "⚠ Completa los campos obligatorios (*)."; errorDiv.style.display = "block"; return; }
            
            const mensajeFormateado = `🔥 *NUEVO LEAD - MAREA MEDIOS* 🔥%0A%0A• *Nombre:* ${encodeURIComponent(name)}%0A• *Correo:* ${encodeURIComponent(email)}%0A• *WhatsApp:* ${encodeURIComponent(phone)}%0A• *Negocio:* ${encodeURIComponent(business)}%0A• *Detalles:* ${encodeURIComponent(msg || 'Sin comentarios')}`;
            window.open(`https://wa.me/${numeroAgenciaWhatsApp}?text=${mensajeFormateado}`, '_blank');
            closeModal(); document.getElementById("marea-modal-form").reset();
          });
        }

        // --- 2. CONTROL DEL MINI CHAT COMPACTO CARD ---
        const supportWidget = document.getElementById("marea-support-widget");
        const toggleWidgetBtn = document.getElementById("marea-widget-toggle-btn");
        const closeCardBtn = document.getElementById("close-chat-card-btn");
        const sendWidgetBtn = document.getElementById("marea-widget-send-arrow");
        const widgetTextarea = document.getElementById("marea-widget-text");
        
        const iconChat = document.getElementById("marea-widget-chat-icon");
        const iconClose = document.getElementById("marea-widget-close-icon");

        function openFloatingChat() {
          supportWidget.classList.add("chat-visible");
          toggleWidgetBtn.classList.add("active-state");
          iconChat.style.display = "none";
          iconClose.style.display = "block";
          widgetTextarea.focus();
        }

        function closeFloatingChat() {
          supportWidget.classList.remove("chat-visible");
          toggleWidgetBtn.classList.remove("active-state");
          iconChat.style.display = "block";
          iconClose.style.display = "none";
          widgetTextarea.value = "";
        }

        if (toggleWidgetBtn) {
          toggleWidgetBtn.addEventListener("click", (e) => {
            e.preventDefault(); e.stopPropagation();
            if (!supportWidget.classList.contains("chat-visible")) {
              openFloatingChat();
            } else {
              closeFloatingChat();
            }
          });
        }

        if (closeCardBtn) {
          closeCardBtn.addEventListener("click", (e) => {
            e.preventDefault(); e.stopPropagation();
            closeFloatingChat();
          });
        }

        if (sendWidgetBtn) {
          sendWidgetBtn.addEventListener("click", (e) => {
            e.preventDefault(); e.stopPropagation();
            despacharMensajeSoporte();
          });
        }

        if (widgetTextarea) {
          widgetTextarea.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              despacharMensajeSoporte();
            }
          });
        }

        function despacharMensajeSoporte() {
          const texto = widgetTextarea.value.trim();
          if (!texto) {
            widgetTextarea.focus();
            return;
          }

          const msjEstructurado = `⚡ *SOPORTE MAREA MEDIOS* ⚡%0A%0A💬 *Mensaje:* ${encodeURIComponent(texto)}%0A%0A_Enviado desde el widget de asistencia técnica de la web._`;
          window.open(`https://wa.me/${numeroAgenciaWhatsApp}?text=${msjEstructurado}`, '_blank');
          
          closeFloatingChat();
        }
      })();
    </script>
  </body>
</html>
